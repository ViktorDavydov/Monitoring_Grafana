version: '3'

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11-bullseye
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: /bin/sh -c " python -m pip install --upgrade pip && (python -m pip install -r /workspace/requirements.txt || true) && while sleep 1000; do :; done"
    ports:
      - 8080:8080
    networks:
      - local

networks:
  local: