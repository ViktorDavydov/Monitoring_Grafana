version: '3'

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11-bullseye
    working_dir: /workspace
    volumes:
      - ../:/workspace
    command: /bin/sh -c "pip install -r demoapp/requirements.txt && while sleep 1000; do :; done"
    ports:
      - 8080:8080
    networks:
      - local

networks:
  local: